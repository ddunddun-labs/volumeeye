<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101218"><meta name="description" content="주식, 국내코인, 바이낸스의 일별 현물 거래대금을 한눈에 비교하는 VolumeEye."><title>VolumeEye — 시장의 움직임을 한눈에</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231b2526'/%3E%3Cpath d='M6 20l6-9 6 13 8-17' stroke='%237ce6b2' stroke-width='3' fill='none'/%3E%3C/svg%3E"><link rel="stylesheet" href="./style.css"><script type="module" src="./app.js"></script></head>
<body><header><a class="brand" href="./" aria-label="VolumeEye 홈"><span class="brand-icon">⌁</span>Volume<span>Eye</span><small>MARKET OBSERVATORY</small></a><div class="header-right"><span class="sample-pill">샘플 데이터</span><span class="labs">DDUNDDUN LABS ↗</span></div></header>
<div class="shell"><aside><div class="sidebar-title">데이터 선택 <button id="reset" class="text-button">초기화</button></div><p class="muted sidebar-copy">비교할 시장을 선택하세요.</p><div id="tree"></div><div class="sidebar-note"><span class="status-dot"></span> 일별 데이터 · 현물<div id="updated" aria-live="polite">불러오는 중</div><p>시장별 기준일은 각 수치 아래에 표시됩니다.</p><div class="demo-notice"><span>ⓘ</span><div><strong>가상 샘플 데이터</strong><br>실제 시장 수치가 아닙니다.</div></div><details class="method"><summary>데이터 안내 및 집계 기준 <span>＋</span></summary><div></div></details></div></aside>
<main><section id="cards" class="cards" aria-label="선택 시장 최신 거래대금"></section>
<section class="chart-panel"><div class="chart-heading"><div><h2>시장별 거래대금 <span>KRW</span></h2><p id="chart-subtitle">일별 현물 거래대금</p></div><div class="view-toggle" role="group" aria-label="그래프 형태"><button data-style="dots" class="active" aria-pressed="true">점 그래프</button><button data-style="line" aria-pressed="false">선 그래프</button></div></div>
<div class="chart-tools"><div class="periods" aria-label="기간 선택"><button data-period="30">1개월</button><button data-period="90">3개월</button><button data-period="180" class="active">6개월</button><button data-period="365">1년</button><button data-period="all">전체</button></div><div class="date-tools"><input id="start" type="date" aria-label="시작 날짜"><span>—</span><input id="end" type="date" aria-label="종료 날짜"></div></div>
<div id="legend" class="legend"></div><div class="plot" id="plot"><canvas id="chart" role="img" aria-label="시장별 일별 거래대금 비교 그래프"></canvas><div id="tooltip" class="tooltip" hidden></div><div id="empty" class="empty" hidden>비교할 시장을 왼쪽에서 선택해주세요.</div></div><div class="chart-footer"><span id="range-label"></span><span>스크롤로 확대 · 드래그로 이동 · 두 번 클릭하면 초기화</span></div>
</section>
<footer><span class="footer-brand">VolumeEye <span>by Ddunddun Labs</span></span><span>매일의 숫자에서, 시장의 흐름을.</span></footer><div id="error" role="alert" hidden></div></main></div></body></html>
